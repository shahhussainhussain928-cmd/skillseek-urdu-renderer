
name: SkillSeek Urdu First Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow arabic-reshaper python-bidi

      - name: Check files
        run: |
          test -f video_content.json
          test -f skillseek_render.py
          python -m py_compile skillseek_render.py
          python -m json.tool video_content.json > /dev/null
          echo "Required files are valid."

      - name: Render video
        run: python skillseek_render.py

      - name: Upload video and font test
        uses: actions/upload-artifact@v4
        with:
          name: skillseek-urdu-first-video
          path: |
            skillseek_render_output/skillseek-urdu-first-video.mp4
            skillseek_render_output/urdu-font-test.png
          if-no-files-found: error
          retention-days: 7
