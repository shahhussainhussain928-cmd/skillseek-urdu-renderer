name: SkillSeek Urdu Video Renderer

on:
  workflow_dispatch:
  push:
    paths:
      - "render.py"
      - ".github/workflows/render.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install Pillow arabic-reshaper python-bidi

      
     - name: Download Urdu font
       run: mkdir -p fonts && curl -fL "https://raw.githubusercontent.com/google/fonts/main/ofl/notonastaliqurdu/NotoNastaliqUrdu%5Bwght%5D.ttf" -o fonts/NotoNastaliqUrdu-Regular.ttf && test -s fonts/NotoNastaliqUrdu-Regular.ttf

      
  
           mkdir -p fonts
           curl -fL "https://raw.githubusercontent.com/google/fonts/main/ofl/notonastaliqurdu/NotoNastaliqUrdu%5Bwght%5D.ttf" -o fonts/NotoNastaliqUrdu-Regular.ttf
           test -s fonts/NotoNastaliqUrdu-Regular.ttfrun: |
           mkdir -p fonts
           curl -fL \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/notonastaliqurdu/NotoNastaliqUrdu%5Bwght%5D.ttf" \
            -o fonts/NotoNastaliqUrdu-Regular.ttf
          test -s fonts/NotoNastaliqUrdu-Regular.ttf

            - name: Check files and render video
          run: |
          echo "Current directory:"
          pwd
          echo "Current commit:"
          git rev-parse --short HEAD
          echo "Tracked files:"
          git ls-files
          echo "Searching for render.py:"
          find . -name render.py -type f
          test -f render.py || {
            echo "ERROR: render.py is missing from this commit"
            exit 1
          }
          python ./render.py
  

      - name: Save rendered video
        uses: actions/upload-artifact@v4
        with:
          name: skillseek-urdu-test
          path: output/skillseek-test.mp4
          if-no-files-found: error
          retention-days: 7
